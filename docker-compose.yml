networks:
  mentoring-net:
    name: mentoring-net
    external: true

services:
  app:
    image: ghcr.io/alexbykovchenko/rag-service:latest
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    networks:
      - mentoring-net
    restart: unless-stopped
